name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  WXLAMBDA_TEST_REPORT: test-results

jobs:
  gui:
    name: GUI tests / ${{ matrix.os }} / SBCL
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ sbcl libwxgtk3.2-dev xvfb xauth
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install cmake sbcl wxwidgets@3.2
      - name: Fetch pinned Lisp dependencies
        run: python3 ci/fetch-deps.py
      - name: Check test reporting
        run: python3 -m unittest discover -s tests -p test_runner.py
      - name: Configure
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DwxWidgets_CONFIG_EXECUTABLE="$(brew --prefix wxwidgets@3.2)/bin/wx-config-3.2"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test under Xvfb
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a python3 tests/run.py
          sbcl --noinform --no-sysinit --no-userinit --non-interactive
          --load ci/setup.lisp
      - name: Test on macOS
        if: runner.os == 'macOS'
        run: >-
          python3 tests/run.py
          sbcl --noinform --no-sysinit --no-userinit --non-interactive
          --load ci/setup.lisp

      - name: Preserve platform test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-${{ matrix.os }}-sbcl
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: GUI tests / Windows x64 / MSVC / SBCL
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out wxWidgets 3.2.12
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wxWidgets/wxWidgets
          ref: 3b7c7fc839093ad28146bd17555af2565c792c96 # v3.2.12
          path: vendor/wxWidgets
          submodules: recursive
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Stage pinned SBCL x64
        shell: pwsh
        run: ./ci/install-sbcl.ps1 -Destination "$env:RUNNER_TEMP/wxlambda-sbcl"
      - name: Fetch pinned Lisp dependencies
        run: python ci/fetch-deps.py
      - name: Check test reporting
        run: python -m unittest discover -s tests -p test_runner.py
      - name: Build wxWidgets release DLLs
        shell: cmd
        working-directory: vendor/wxWidgets/build/msw
        run: nmake /f makefile.vc BUILD=release SHARED=1 TARGET_CPU=X64
      - name: Configure bridge
        run: >-
          cmake -S . -B build -A x64
          -DwxWidgets_ROOT_DIR="${{ github.workspace }}/vendor/wxWidgets"
          -DwxWidgets_LIB_DIR="${{ github.workspace }}/vendor/wxWidgets/lib/vc_x64_dll"
          -DwxWidgets_CONFIGURATION=mswu
          -DwxWidgets_USE_REL_AND_DBG=OFF
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE="${{ github.workspace }}/build"
      - name: Build bridge
        run: cmake --build build --config Release --parallel 2
      - name: Test Lisp loading and GUI lifecycle
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/vendor/wxWidgets/lib/vc_x64_dll;$env:PATH"
          if (-not (Test-Path build/wxlambda.dll)) { throw 'Bridge DLL missing from build/' }
          python tests/run.py sbcl --noinform --no-sysinit --no-userinit --non-interactive --load ci/setup.lisp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve platform test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-windows-2022-sbcl
          path: |
            test-results/
            ${{ runner.temp }}/wxlambda-sbcl/install.log
          if-no-files-found: warn
          retention-days: 30
